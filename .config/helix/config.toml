theme = "ferra"

[editor]
scrolloff = 6
mouse = false
scroll-lines = 1
cursorline = true
true-color = true
undercurl = true
line-number = "relative"
bufferline = "multiple"
clipboard-provider = "wayland"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "▏"

[editor.file-picker]
hidden = false

[editor.auto-save]
focus-lost = true

[editor.statusline]
left = ["mode", "diagnostics", "spinner"]
center = []
right = ["position", "total-line-numbers", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[keys.normal]
C-s = ":write"
