# Основной фон и текст редактора
"ui.background" = { fg = "#3b3b3b", bg = "#ffffff" }
"ui.text" = "#3b3b3b"
"ui.text.focus" = { fg = "#000000", bg = "#e8e8e8", modifiers = ["bold"] }
"ui.text.inactive" = "#868686"

# Курсор (синий прямоугольник)
"ui.cursor" = { bg = "#005fb8" }
"ui.cursor.primary" = { bg = "#005fb8" }
"ui.cursor.match" = { modifiers = ["bold"] }

# Выделение
"ui.selection" = { bg = "#add6ff" }
"ui.selection.primary" = { bg = "#add6ff" }

# Область gutter (фон как у редактора, текст под цвет номеров строк)
"ui.gutter" = { fg = "#6e7681", bg = "#ffffff" }
"ui.linenr" = "#6e7681"
"ui.linenr.selected" = "#171184"

# Строка состояния
"ui.statusline" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.statusline.inactive" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.statusline.normal" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.statusline.insert" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.statusline.select" = { fg = "#3b3b3b", bg = "#f8f8f8" }

# Вкладки (буферы)
"ui.bufferline" = { fg = "#868686", bg = "#f8f8f8" }
"ui.bufferline.active" = { fg = "#3b3b3b", bg = "#ffffff", modifiers = [
    "bold",
] }
"ui.bufferline.background" = { bg = "#f8f8f8" }

# Всплывающие окна
"ui.popup" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.help" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.menu" = { fg = "#3b3b3b", bg = "#f8f8f8" }
"ui.menu.selected" = { fg = "#000000", bg = "#e8e8e8" }

# Разделители окон
"ui.window" = "#e5e5e5"

# Направляющие отступов и линейки
"ui.virtual.indent-guide" = "#d3d3d3"
"ui.virtual.ruler" = "#d3d3d3"
"ui.virtual.wrap" = "#e5e5e5"

# Подсветка активной строки (лёгкий серый, как в VS Code)
"ui.cursorline.primary" = { bg = "#f5f5f5" }

# Диагностика
"diagnostic.error" = { underline = { color = "#f85149", style = "curl" } }
"diagnostic.warning" = { underline = { color = "#bf8803", style = "curl" } }
"diagnostic.info" = { underline = { color = "#0063d3", style = "curl" } }
"diagnostic.hint" = { underline = { color = "#6e7681", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
error = "#f85149"
warning = "#bf8803"
info = "#0063d3"
hint = "#6e7681"

# Diff
"diff.plus" = "#098658"
"diff.minus" = "#A31515"
"diff.delta" = "#0451A5"
"diff.plus.gutter" = "#2ea043"
"diff.minus.gutter" = "#f85149"
"diff.delta.gutter" = "#005fb8"

